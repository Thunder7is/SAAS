name: saas
description: A clean architecture attendance management Flutter application with local SQLite storage, college rule engine, CSV/XLSX file import mapping, and online/offline sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.6
  csv: ^6.0.0
  excel: ^4.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
